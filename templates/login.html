{% extends 'base.html' %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h1>🏏 Welcome Back</h1>

        <p>Login to continue predictions</p>

        {% if error %}
        <div class="error-box">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <input
                type="text"
                name="username"
                placeholder="Username"
                required>

            <input
                type="password"
                name="password"
                placeholder="Password"
                required>

            <button type="submit">
                Login
            </button>

        </form>

        <div class="auth-link">
            New user?
            <a href="{% url 'signup' %}">
                Sign Up
            </a>
        </div>

    </div>

</div>

{% endblock %}
